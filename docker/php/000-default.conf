<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    PassEnv APP_ENV
    PassEnv APP_DEBUG
    PassEnv APP_SECRET
    PassEnv DATABASE_URL
    PassEnv MAILER_URL
    PassEnv CORS_ALLOW_ORIGIN
    PassEnv JWT_SECRET_KEY
    PassEnv JWT_PUBLIC_KEY
    PassEnv JWT_PASSPHRASE
    PassEnv TRUSTED_PROXIES
    PassEnv TRUSTED_HOSTS

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        CGIPassAuth On
        RewriteEngine On
        # Lexik JWT: Apache drops Authorization on the front controller rewrite.
        RewriteCond %{HTTP:Authorization} ^(.*)
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%1]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
