# Local only. Ignored when using `-f docker-compose.yml -f docker-compose.prod.yml`.
services:
  front:
    build:
      context: .
      dockerfile: docker/front/Dockerfile
    environment:
      DEV_HOST: "0.0.0.0"
      DEV_PORT: "3000"
      DEV_PUBLIC: "localhost:3000"
      DEV_OPEN: "0"
      API_PROXY: "http://api:80"
    volumes:
      - ./client:/app
      - front_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  front_node_modules:
